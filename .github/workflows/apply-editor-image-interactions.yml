name: Apply editor interaction update

on:
  push:
    branches:
      - feature/editor-recent-llm-image-reorder-preview
    paths:
      - scripts/apply-editor-image-interactions.py
      - .github/workflows/apply-editor-image-interactions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/editor-recent-llm-image-reorder-preview
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: |
          python scripts/apply-editor-image-interactions.py
          python scripts/fix-editor-interaction-tests.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: node --test
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/apply-editor-image-interactions.py scripts/fix-editor-interaction-tests.py .github/workflows/apply-editor-image-interactions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve prompt editor image interactions"
          git push origin HEAD:feature/editor-recent-llm-image-reorder-preview
