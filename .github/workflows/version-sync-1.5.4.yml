name: Temporary 1.5.4 Version Sync

on:
  push:
    branches:
      - perf/archive-incremental-load-1.5.4

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[version-sync-1.5.4]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/archive-incremental-load-1.5.4
      - name: Synchronize release version and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version_files = [
              "index.html",
              "prompt-organization-backup.js",
              "library-controls.js",
              "archive-six-columns.js",
              "archive-viewer-layout.js",
              "ui-enhancements.js",
              "version-display.js",
              "release-notes.js",
              "sw.js",
          ]
          for name in version_files:
              path = Path(name)
              text = path.read_text()
              path.write_text(text.replace("1.5.3", "1.5.4"))

          sw = Path("sw.js")
          text = sw.read_text().replace('prompt-manager-shell-v47', 'prompt-manager-shell-v48')
          if '"./archive-pagination-core.mjs"' not in text:
              text = text.replace('  "./prompt-db.mjs",\n', '  "./prompt-db.mjs",\n  "./archive-pagination-core.mjs",\n')
          sw.write_text(text)

          for path in Path("test").glob("*.mjs"):
              text = path.read_text().replace("1.5.3", "1.5.4").replace("prompt-manager-shell-v47", "prompt-manager-shell-v48")
              path.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          if "## [1.5.4] - 2026-08-17" not in text:
              marker = "## [미출시]\n\n현재 예정된 변경 사항이 없습니다.\n"
              entry = """

## [1.5.4] - 2026-08-17

### 성능

- 보관함 진입 시 모든 첨부 이미지 원본을 한 번에 읽지 않고 경량 요약 목록만 먼저 확인한 뒤 약 24장 단위의 첫 묶음만 로드하도록 변경했습니다.
- 목록 끝에 도달한 상태에서 위로 스와이프하거나 마우스 휠을 더 내리면 다음 이미지 묶음을 추가로 읽도록 변경했습니다.
- 추가 로드는 최대 12개 프롬프트 레코드씩 하나의 IndexedDB 읽기 트랜잭션에서 처리하고, 이미지 디코딩은 비동기로 요청합니다.
- 보관함 LLM 필터를 변경하면 선택된 LLM의 요약만 대상으로 페이지를 다시 구성해 불필요한 이미지 원본 읽기를 줄였습니다.
- 보관함을 떠나면 기존과 같이 로드된 이미지 DOM과 메모리 참조를 해제합니다.

### 테스트

- 보관함 요약 필터링, 약 24장 단위 페이지 분할, 프롬프트 배치 제한을 검증하는 테스트를 추가했습니다.
- 보관함 코드가 전체 프롬프트 원본 조회 대신 요약 조회와 배치 레코드 조회를 사용하는지 확인하는 회귀 테스트를 추가했습니다.
"""
              if marker not in text:
                  raise SystemExit("CHANGELOG insertion marker not found")
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text)
          PY

          git rm .github/workflows/version-sync-1.5.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[version-sync-1.5.4] Synchronize archive lazy-loading release"
          git push origin HEAD:perf/archive-incremental-load-1.5.4
