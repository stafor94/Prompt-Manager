name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for source_file in \
            app.js \
            archive-viewer-layout.js \
            archive-viewer-layout-core.mjs \
            archive-six-columns.js \
            image-navigation.js \
            image-metadata.mjs \
            image-viewer-fit.js \
            library-controls.js \
            prompt-organization-backup.js \
            release-notes.js \
            version-display.js \
            ui-enhancements.js \
            sw.js; do
            if ! node --check "$source_file"; then
              source_name="$(basename "$source_file")"
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state=failure \
                -f context="prompt-manager/failing-check-${source_name}" \
                -f description="node --check ${source_file} failed"
              exit 1
            fi
          done
      - name: Run tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node --test 2>&1 | tee /tmp/node-test-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi
          failure_line="$(grep -m1 '^not ok ' /tmp/node-test-output.txt || true)"
          failure_code="$(printf '%s' "$failure_line" | head -c 60 | base64 | tr '+/' '-_' | tr -d '=\n')"
          if [ -z "$failure_code" ]; then
            failure_code="dW5rbm93bg"
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="prompt-manager/test-failure-b64-${failure_code}" \
            -f description='node --test failed'
          exit "$test_status"
      - name: Publish verification success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='prompt-manager/verification' \
            -f description='node --check and node --test passed'
      - name: Publish verification failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='prompt-manager/verification' \
            -f description='node --check or node --test failed'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish deployment success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='prompt-manager/deployment' \
            -f description='GitHub Pages deployment succeeded'
      - name: Publish deployment failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='prompt-manager/deployment' \
            -f description='GitHub Pages deployment failed'
