name: Apply viewer caption auto-hide

on:
  push:
    branches:
      - fix/viewer-caption-auto-hide

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/viewer-caption-auto-hide
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply update
        run: python scripts/apply-viewer-caption-auto-hide.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: node --test
      - name: Commit update
        shell: bash
        run: |
          rm -f scripts/apply-viewer-caption-auto-hide.py .github/workflows/apply-viewer-caption-auto-hide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-hide image viewer caption"
          git push origin HEAD:fix/viewer-caption-auto-hide
