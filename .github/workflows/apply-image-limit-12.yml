name: Apply image attachment limit 12

on:
  push:
    branches:
      - feature/image-attachment-limit-12
    paths:
      - scripts/apply-image-limit-12.py
      - .github/workflows/apply-image-limit-12.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/image-attachment-limit-12
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python scripts/apply-image-limit-12.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: node --test
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/apply-image-limit-12.py .github/workflows/apply-image-limit-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: allow 12 prompt images"
          git push origin HEAD:feature/image-attachment-limit-12
