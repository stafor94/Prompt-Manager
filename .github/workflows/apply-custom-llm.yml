name: Apply custom LLM implementation

on:
  push:
    branches:
      - feature/custom-llm-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/custom-llm-settings
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-custom-llm.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)',
          )
          source = source.replace(
              '''replace_once("prompt-organization-backup.js", '${LLM_LABELS[prompt.llmType]??escapeHtml(prompt.llmType)}', '${escapeHtml(llmLabel(prompt.llmType))}')''',
              '''replace_once("prompt-organization-backup.js", 'LLM_LABELS[prompt.llmType]??escapeHtml(prompt.llmType)', 'escapeHtml(llmLabel(prompt.llmType))')''',
          )
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/apply-custom-llm.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: node --test
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/apply-custom-llm.py .github/workflows/apply-custom-llm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add custom LLM settings"
          git push origin HEAD:feature/custom-llm-settings
